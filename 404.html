<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>THM Korea</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/clavicula, /en/fibula ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/thm/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/thm/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'clavicula-se':'clavicula', 'se':'clavicula', 'crank':'clavicula', 'cranks':'clavicula', 'crankset':'clavicula', 'cranksets':'clavicula',
                'dm':'clavicula', 'clavicula-dm':'clavicula', 'xc':'clavicula', 'clavicula-xc':'clavicula', 'powermeter':'clavicula', 'power-meter':'clavicula',
                'brake':'fibula', 'brakes':'fibula', 'tibia':'cockpit', 'stem':'cockpit', 'ulna':'cockpit', 'handlebar':'cockpit', 'frontale':'cockpit', 'frontale-aero':'cockpit', 'aero':'cockpit',
                'seatpost':'mandibula', 'compatibility':'fit', 'fit-guide':'fit', 'bb':'fit', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, clavicula:1, fibula:1, cockpit:1, mandibula:1, fit:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
